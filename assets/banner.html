<!doctype html><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
*{box-sizing:border-box;margin:0}
body{width:1280px;height:640px;background:#0E1320;color:#E5E9F1;font-family:"IBM Plex Sans",Arial,sans-serif;position:relative;overflow:hidden}
.grid{position:absolute;inset:0;background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:40px 40px}
.glow{position:absolute;right:-120px;top:-160px;width:640px;height:640px;border-radius:50%;background:radial-gradient(#2C47C455,transparent 68%)}
.wrap{position:absolute;left:96px;top:0;bottom:0;right:96px;display:flex;flex-direction:column;justify-content:center;gap:28px}
.row{display:flex;align-items:center;gap:36px}
.row svg{width:168px;height:168px;flex:none}
h1{font-family:"Archivo",Arial,sans-serif;font-weight:800;font-stretch:125%;font-size:112px;letter-spacing:-.035em;line-height:.95}
.tag{font-size:30px;line-height:1.35;color:#AEB8CC;max-width:900px}
.tag b{color:#E5E9F1;font-weight:500}
.chips{display:flex;gap:14px;margin-top:6px}
.chip{font-family:"IBM Plex Mono",monospace;font-size:21px;padding:8px 18px;border:1.5px solid #3A4766;border-radius:999px;color:#9DB0FF}
.chip.g{border-color:#6FD39C;color:#6FD39C}
.cmd{position:absolute;left:96px;bottom:48px;font-family:"IBM Plex Mono",monospace;font-size:22px;color:#7D88A0}
.cmd i{font-style:normal;color:#6FD39C}.cmd u{text-decoration:none;color:#9DB0FF}
</style>
<div class="grid"></div><div class="glow"></div>
<div class="wrap">
