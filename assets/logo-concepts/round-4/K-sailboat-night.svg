<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t">
  <title id="t">Shipwright logo: a sailing yacht at night under a full moon, a green check on its mainsail</title>
  <defs>
    <clipPath id="tile"><rect width="512" height="512" rx="108"/></clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070B1A"/><stop offset=".55" stop-color="#121C44"/><stop offset="1" stop-color="#26398A"/>
    </linearGradient>
    <radialGradient id="horizon" cx=".5" cy="1" r=".7">
      <stop offset="0" stop-color="#4E68E8" stop-opacity=".55"/><stop offset="1" stop-color="#4E68E8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moonglow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#DDE5FF" stop-opacity=".55"/><stop offset=".35" stop-color="#9DB0FF" stop-opacity=".18"/><stop offset="1" stop-color="#9DB0FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22389E"/><stop offset=".4" stop-color="#16276E"/><stop offset="1" stop-color="#0A1234"/>
    </linearGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset=".6" stop-color="#DCE3F2"/><stop offset="1" stop-color="#9FAACB"/>
    </linearGradient>
    <linearGradient id="main" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#C3CCE2"/><stop offset=".35" stop-color="#F4F7FD"/><stop offset=".75" stop-color="#FFFFFF"/><stop offset="1" stop-color="#D5DCEC"/>
    </linearGradient>
    <linearGradient id="jib" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A9B5D3"/><stop offset=".45" stop-color="#E9EEF8"/><stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="refl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".28"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#tile)">
    <!-- sky -->
    <rect width="512" height="512" fill="url(#sky)"/>
    <rect y="200" width="512" height="140" fill="url(#horizon)"/>
    <g fill="#E5E9F1">
      <circle cx="62" cy="70" r="1.8"/><circle cx="118" cy="40" r="1.2"/><circle cx="160" cy="98" r="1.5"/>
      <circle cx="300" cy="52" r="1.3"/><circle cx="462" cy="200" r="1.4"/><circle cx="90" cy="168" r="1.1"/>
      <circle cx="470" cy="60" r="1.6"/><circle cx="330" cy="150" r="1"/><circle cx="40" cy="250" r="1.2"/>
      <circle cx="210" cy="30" r="1"/><circle cx="440" cy="270" r="1"/>
    </g>
    <!-- moon -->
    <circle cx="392" cy="118" r="110" fill="url(#moonglow)"/>
    <circle cx="392" cy="118" r="36" fill="#E9EEFF"/>
    <circle cx="380" cy="108" r="7" fill="#C9D2EA" opacity=".6"/><circle cx="404" cy="130" r="5" fill="#C9D2EA" opacity=".5"/><circle cx="398" cy="100" r="3.5" fill="#C9D2EA" opacity=".5"/>
    <!-- sea -->
    <rect y="334" width="512" height="178" fill="url(#sea)"/>
    <path d="M0 334H512" stroke="#6C86FF" stroke-opacity=".5" stroke-width="2"/>
    <!-- moon path on water -->
    <g stroke="#E9EEFF" stroke-linecap="round">
      <line x1="374" y1="346" x2="410" y2="346" stroke-width="3" stroke-opacity=".7"/>
      <line x1="364" y1="358" x2="400" y2="358" stroke-width="3" stroke-opacity=".55"/>
      <line x1="382" y1="372" x2="426" y2="372" stroke-width="3" stroke-opacity=".45"/>
      <line x1="360" y1="390" x2="396" y2="390" stroke-width="3" stroke-opacity=".35"/>
      <line x1="388" y1="410" x2="440" y2="410" stroke-width="3" stroke-opacity=".25"/>
      <line x1="370" y1="434" x2="412" y2="434" stroke-width="3" stroke-opacity=".18"/>
    </g>
    <!-- swell lines -->
    <g fill="none" stroke="#9DB0FF" stroke-linecap="round">
      <path d="M20 420Q60 412 100 420T180 420" stroke-opacity=".22" stroke-width="2.5"/>
      <path d="M250 452Q290 444 330 452T410 452T490 452" stroke-opacity=".18" stroke-width="2.5"/>
      <path d="M40 476Q80 468 120 476T200 476" stroke-opacity=".14" stroke-width="2.5"/>
    </g>
    <!-- hull reflection -->
    <path d="M126 374L376 368Q366 388 344 396L160 400Q140 394 126 374Z" fill="url(#refl)"/>
    <!-- wake -->
    <g fill="none" stroke="#FFFFFF" stroke-linecap="round">
      <path d="M150 380Q110 386 60 384" stroke-opacity=".45" stroke-width="3"/>
      <path d="M160 388Q120 398 72 402" stroke-opacity=".25" stroke-width="2.5"/>
    </g>
    <!-- rigging -->
    <g stroke="#AEB8CC" stroke-width="1.6">
      <line x1="238" y1="92" x2="370" y2="340"/>
      <line x1="238" y1="92" x2="132" y2="352"/>
    </g>
    <!-- mainsail -->
    <path d="M232 100C210 160 170 240 152 316L232 312Z" fill="url(#main)"/>
    <path d="M232 100C210 160 170 240 152 316" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <g stroke="#B4BFD9" stroke-width="2" stroke-linecap="round">
      <line x1="214" y1="150" x2="232" y2="150"/><line x1="196" y1="196" x2="232" y2="196"/>
      <line x1="178" y1="244" x2="232" y2="244"/><line x1="164" y1="288" x2="232" y2="288"/>
    </g>
    <polyline points="190,222 204,236 228,206" fill="none" stroke="#1F9D62" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- jib -->
    <path d="M246 116L364 334L258 326C266 256 260 182 246 116Z" fill="url(#jib)"/>
    <path d="M246 116L364 334" stroke="#FFFFFF" stroke-width="1.6"/>
    <path d="M258 326C266 256 260 182 246 116" fill="none" stroke="#9AA6C6" stroke-width="1.4"/>
    <!-- mast + boom -->
    <line x1="238" y1="88" x2="238" y2="344" stroke="#E5E9F1" stroke-width="5" stroke-linecap="round"/>
    <line x1="238" y1="316" x2="148" y2="322" stroke="#C9D2E6" stroke-width="5" stroke-linecap="round"/>
    <!-- burgee -->
    <path d="M238 86L212 92L238 98Z" fill="#6FD39C"/>
    <!-- hull -->
    <path d="M124 346L378 334Q368 354 346 370L162 376Q140 370 124 346Z" fill="url(#hull)"/>
    <path d="M132 354L370 343Q366 348 361 352L144 362Q137 359 132 354Z" fill="#2C47C4"/>
    <path d="M152 371L350 366Q348 368 346 370L162 376Q156 374 152 371Z" fill="#6FD39C"/>
    <path d="M124 346L378 334" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="196" y="334" width="34" height="8" rx="3" fill="#C9D2E6"/>
    <g fill="#22389E"><rect x="200" y="336" width="6" height="4" rx="1"/><rect x="210" y="336" width="6" height="4" rx="1"/><rect x="220" y="336" width="6" height="4" rx="1"/></g>
    <!-- bow spray -->
    <g fill="none" stroke="#FFFFFF" stroke-linecap="round">
      <path d="M352 370Q366 362 384 364" stroke-opacity=".7" stroke-width="3"/>
      <path d="M346 376Q368 372 392 378" stroke-opacity=".4" stroke-width="2.5"/>
    </g>
  </g>
</svg>
